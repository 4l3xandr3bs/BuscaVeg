<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BuscaVeg - Login</title>

    <link rel="stylesheet" href="/login.css">
</head>

<body>
    <div class="login-container">

        <div class="logo">
            🥗
        </div>

        <h1>BuscaVeg</h1>

        <p class="subtitle">
            Encontre opções vegetarianas e veganas perto de você.
        </p>

        <form th:action="@{/login}" method="post">
            <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}" />

            <label for="username">E-mail</label>
            <input
                id="username"
                type="email"
                name="username"
                placeholder="Digite seu e-mail"
                required>

            <label for="password">Senha</label>
            <input
                id="password"
                type="password"
                name="password"
                placeholder="Digite sua senha"
                required>

            <button type="submit">Entrar</button>
        </form>

        <p class="register">
            Ainda não tem conta?
            <a th:href="@{/usuarioCTR/cadastro}">Cadastre-se</a>
        </p>
    </div>
</body>

</html>
