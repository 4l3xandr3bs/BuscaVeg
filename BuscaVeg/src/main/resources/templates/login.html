
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BuscaVeg - Login</title>

    <link rel="stylesheet" th:href="@{/estilo.css}">
</head>

<body class="pagina-login">

    <div class="login-container">
    <div class="logo">
        <p>𖧧 BuscaVeg</p>
    </div>



        <p class="subtitle">
            Encontre opções vegetarianas e veganas perto de você.
        </p>

        <form th:action="@{/login}" method="post">

            <label for="username">E-mail</label>

            <input
                id="username"
                type="email"
                name="username"
                placeholder="Digite seu e-mail"
                required>

            <label for="password">Senha</label>

            <input
                id="password"
                type="password"
                name="password"
                placeholder="Digite sua senha"
                required>

            <div th:if="${param.error}" class="alert">
                E-mail ou senha inválidos.
            </div>

            <div th:if="${param.cadastrado}" class="alert-success">
                Cadastro realizado! Entre com sua conta.
            </div>

            <div th:if="${param.logout}" class="alert-success">
                Você saiu da sua conta.
            </div>

            <button type="submit">
                Entrar
            </button>

        </form>

        <p class="register">
            Ainda não tem conta?

            <a th:href="@{/usuarioCTR/formCadastrarUsuario}">
                Cadastre-se
            </a>
        </p>

        <p>
            É uma empresa?

            <a th:href="@{/empresarialCTR/formCadastrarEmpresa}">
                Cadastre seu estabelecimento
            </a>
        </p>

    </div>

</body>
</html>
