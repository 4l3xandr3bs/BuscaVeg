<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuscaVeg - Cadastro</title>
    <link rel="stylesheet" href="/css/cadastro.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>

<div class="cadastro-container">

    <div class="logo">🥗</div>

    <h1>Crie sua conta</h1>

    <p class="subtitle">
        Cadastre sua empresa aqui!
    </p>

    <form th:action="@{/empresarialCTR/salvarUsuario}" th:object="${usuario}" method="post">
        <div th:if="${erro}" class="alert" th:text="${erro}"></div>

        <label for="nome">Nome da empresa</label>
        <input
            id="nome"
            type="text"
            th:field="*{nome_fantasia}"
            placeholder="Digite o nome da sua empresa"
            required>

        <label for="email">Razão Social</label>
        <input
            id="email"
            type="email"
            th:field="*{email}"
            placeholder="fale um pouco sobre sua empresa"
            required>

        <label for="password">Senha</label>
        <input
            id="password"
            type="password"
            th:field="*{password}"
            placeholder="Digite sua senha"
            required>

        <label for="perfilAlimentar">Tipo de alimentação</label>
        <select id="perfilAlimentar" th:field="*{perfilAlimentar}" required>
            <option value="">Selecione</option>
            <option value="VEGETARIANO">Vegetariano</option>
            <option value="VEGANO">Vegano</option>
        </select>

        <label for="dataNascimento">Data de nascimento</label>
        <input
            id="dataNascimento"
            type="date"
            th:field="*{dataNascimento}">

        <label for="Endereço">Endereço</label>
        <input
            id=""
            type=""
            step="any"
            th:field="">

        <button type="submit">
            Criar conta
        </button>
    </form>
      
    <p class="login-link">
        Já possui uma conta?
        <a th:href="@{/usuarioCTR/login}">Entrar</a>
    </p>
      <p class="">
        Quer cadastrar uma empresa?
        <a th:href="@{}">registrar sua empresa</a>
      </p>
</div>

</body>
</html>
