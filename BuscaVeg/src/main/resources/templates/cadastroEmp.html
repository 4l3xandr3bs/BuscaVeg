<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuscaVeg - Cadastro da Empresa</title>
    <link rel="stylesheet" th:href="@{/estilo.css}">
</head>
<body>

<div class="cadastro-container">
    <div class="logo">🥗</div>

    <h1>Cadastre sua empresa</h1>
    <p class="subtitle">Cadastre seu local com endereço para aparecer no mapa.</p>

    <form th:action="@{/empresarialCTR/salvarEmpresa}" th:object="${empresarial}" method="post">
        <div th:if="${erro}" class="alert" th:text="${erro}"></div>

        <label for="nomeFantasia">Nome da empresa</label>
        <input id="nomeFantasia" type="text" th:field="*{nomeFantasia}" required>

        <label for="razaoSocial">Razão social</label>
        <input id="razaoSocial" type="text" th:field="*{razaoSocial}" required>

        <label for="email">E-mail</label>
        <input id="email" type="email" th:field="*{email}" required>

        <label for="password">Senha</label>
        <input id="password" type="password" th:field="*{password}" required>

        <label for="cnpj">CNPJ</label>
        <input id="cnpj" type="text" th:field="*{cnpj}" required>

        <label for="telefone">Telefone</label>
        <input id="telefone" type="text" th:field="*{telefone}" required>

        <label for="tipoEspecializacao">Tipo de estabelecimento</label>
        <select id="tipoEspecializacao" th:field="*{tipoEspecializacao}" required>
            <option value="">Selecione</option>
            <option value="RESTAURANTE">Restaurante</option>
            <option value="MERCADO">Mercado</option>
        </select>

        <label for="endereco">Endereço completo</label>
        <input id="endereco" type="text" th:field="*{endereco}" placeholder="Rua, número, bairro, cidade" required>

        <input type="hidden" id="latitude" th:field="*{latitude}">
        <input type="hidden" id="longitude" th:field="*{longitude}">

        <button type="submit">Criar conta</button>
    </form>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const form = document.querySelector('form');
        const enderecoInput = document.getElementById('endereco');
        const latInput = document.getElementById('latitude');
        const lngInput = document.getElementById('longitude');

        form.addEventListener('submit', function (event) {
            event.preventDefault();

            const endereco = enderecoInput.value.trim();
            if (!endereco) {
                alert('Informe o endereço.');
                return;
            }

            fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&q=${encodeURIComponent(endereco)}`)
                .then(res => res.json())
                .then(data => {
                    if (!data || data.length === 0) {
                        alert('Endereço não encontrado.');
                        return;
                    }

                    latInput.value = data[0].lat;
                    lngInput.value = data[0].lon;
                    form.submit();
                })
                .catch(() => {
                    alert('Erro ao geocodificar endereço.');
                });
        });
    });
</script>

</body>
</html>
