<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuscaVeg - Lugares</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7f5;
            color: #333;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 28px;
            background: white;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
        }
        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #2e7d32;
        }
        nav {
            display: flex;
            gap: 20px;
        }
        nav a {
            color: #555;
            text-decoration: none;
            font-weight: bold;
        }
        main {
            width: 88%;
            max-width: 1200px;
            margin: 32px auto 60px;
        }
        .hero {
            margin-bottom: 20px;
        }
        .hero h1 {
            color: #245c29;
            font-size: 38px;
            margin-bottom: 8px;
        }
        .hero p {
            color: #666;
            margin: 0;
        }
        #map {
            width: 100%;
            height: 520px;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 6px 22px rgba(0,0,0,.12);
            margin-bottom: 24px;
        }
        .section-title {
            margin-bottom: 16px;
        }
        .section-title h2 {
            margin: 0;
            color: #333;
        }
        .places-container {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
        }
        .place-card {
            background: white;
            border-radius: 14px;
            box-shadow: 0 3px 12px rgba(0,0,0,.08);
            overflow: hidden;
        }
        .place-image {
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #dcf1de;
            font-size: 72px;
        }
        .place-info {
            padding: 18px;
        }
        .tag {
            display: inline-block;
            background: #ebf6eb;
            color: #2e7d32;
            font-weight: bold;
            border-radius: 6px;
            padding: 5px 8px;
            font-size: 11px;
            margin-bottom: 8px;
        }
        .place-info h3 {
            margin: 8px 0;
            font-size: 20px;
        }
        .place-info p {
            margin: 6px 0;
            color: #555;
        }
        .route-btn {
            background: #43a047;
            color: white;
            border: 0;
            border-radius: 8px;
            padding: 10px 14px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 12px;
        }
        .route-btn:hover {
            background: #2e7d32;
        }
        .empty-state {
            color: #555;
            font-weight: bold;
            padding: 12px 0;
        }
        @media (max-width: 800px) {
            nav { display: none; }
            main { width: 90%; }
            .places-container { grid-template-columns: 1fr; }
            .hero h1 { font-size: 28px; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">🥗 BuscaVeg</div>
    <nav>
        <a th:href="@{/}">Início</a>
        <a th:href="@{/empresarialCTR/listarEmpresas}">Lugares</a>
        <a th:href="@{/favoritos}">Favoritos</a>
        <a th:href="@{/pedidos}">Pedidos</a>
        <a th:href="@{/perfil}">Perfil</a>
    </nav>
</header>

<main>
    <section class="hero">
        <h1>Encontre seu próximo lugar favorito</h1>
        <p>Veja os estabelecimentos mais próximos de você e calcule a rota até eles.</p>
    </section>

    <div id="map"></div>

    <section class="places">
        <div class="section-title">
            <h2>Lugares disponíveis</h2>
        </div>

        <div class="places-container" th:if="${empresas != null}">
            <div th:if="${#lists.isEmpty(empresas)}" class="empty-state">
                Nenhum lugar encontrado.
            </div>

            <div class="place-card" th:each="empresa : ${empresas}">
                <div class="place-image">🥗</div>

                <div class="place-info">
                    <span class="tag" th:text="${empresa.tipoEspecializacao}">TIPO</span>
                    <h3 th:text="${empresa.nomeFantasia}">Nome do estabelecimento</h3>
                    <p th:text="${empresa.endereco}">Endereço</p>
                    <p th:text="${empresa.telefone}">Telefone</p>

                    <button class="route-btn"
                            type="button"
                            th:attr="data-lat=${empresa.latitude}, data-lng=${empresa.longitude}, data-name=${empresa.nomeFantasia}">
                        Traçar rota
                    </button>
                </div>
            </div>
        </div>
    </section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script th:inline="javascript">
    const maptilerKey = /*[[${@environment.getProperty('maptiler.api-key', 'YOUR_MAPTILER_KEY')}]]*/ 'YOUR_MAPTILER_KEY';
    const orsKey = /*[[${@environment.getProperty('ors.api-key', 'YOUR_ORS_KEY')}]]*/ 'YOUR_ORS_KEY';

    const userLat = /*[[${usuario != null && usuario.latitude != null ? usuario.latitude : -23.5505}]]*/ -23.5505;
    const userLng = /*[[${usuario != null && usuario.longitude != null ? usuario.longitude : -46.6333}]]*/ -46.6333;

    const map = L.map('map').setView([userLat, userLng], 12);

    L.tileLayer(`https://api.maptiler.com/maps/streets/{z}/{x}/{y}.png?key=${maptilerKey}`, {
        attribution: '&copy; <a href="https://www.maptiler.com/copyright/">MapTiler</a> &copy; OpenStreetMap contributors'
    }).addTo(map);

    const routeLayer = L.layerGroup().addTo(map);

    function clearRoute() {
        routeLayer.clearLayers();
    }

    function addPlaceMarker(lat, lng, nome) {
        const marker = L.marker([lat, lng]).addTo(map);

        marker.bindPopup(`
            <div>
                <strong>${nome}</strong><br>
                <button class="route-btn" data-lat="${lat}" data-lng="${lng}" data-name="${nome}">
                    Traçar rota
                </button>
            </div>
        `);

        marker.on('popupopen', function () {
            const buttons = document.querySelectorAll('[data-lat][data-lng][data-name]');
            buttons.forEach(btn => {
                const latVal = Number(btn.dataset.lat);
                const lngVal = Number(btn.dataset.lng);
                const nameVal = btn.dataset.name;

                btn.addEventListener('click', function () {
                    buildRoute(latVal, lngVal, nameVal);
                });
            });
        });
    }

    async function buildRoute(destLat, destLng, destName) {
        clearRoute();

        let startLat = userLat;
        let startLng = userLng;

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function (position) {
                startLat = position.coords.latitude;
                startLng = position.coords.longitude;
                requestRoute(startLat, startLng, destLat, destLng, destName);
            }, function () {
                requestRoute(startLat, startLng, destLat, destLng, destName);
            });
        } else {
            requestRoute(startLat, startLng, destLat, destLng, destName);
        }
    }

    function requestRoute(startLat, startLng, destLat, destLng, destName) {
        fetch('https://api.openrouteservice.org/v2/directions/driving-car', {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${orsKey}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                coordinates: [[startLng, startLat], [destLng, destLat]],
                format: 'json',
                geometry: true
            })
        })
        .then(res => res.json())
        .then(data => {
            if (!data.routes || !data.routes.length) {
                alert('Não foi possível calcular a rota.');
                return;
            }

            const coords = data.routes[0].geometry.coordinates;
            const routePoints = coords.map(([lng, lat]) => [lat, lng]);

            L.polyline(routePoints, { color: '#2e7d32', weight: 5 }).addTo(routeLayer);
            map.fitBounds(L.polyline(routePoints).getBounds(), { padding: [25, 25] });

            L.popup()
                .setLatLng([destLat, destLng])
                .setContent(`<strong>${destName}</strong><br>Destino`) 
                .openOn(map);
        })
        .catch(() => {
            alert('Erro ao calcular rota com ORS.');
        });
    }

    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function (position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;

            L.marker([lat, lng]).addTo(map).bindPopup('Você está aqui');
            map.setView([lat, lng], 13);
        });
    }

    fetch(`/api/lugares/proximos?lat=${userLat}&lng=${userLng}&raioKm=10`)
        .then(res => res.json())
        .then(data => {
            if (!data || !data.length) return;

            data.forEach(place => {
                addPlaceMarker(place.latitude, place.longitude, place.nome);
            });
        })
        .catch(err => {
            console.error('Erro ao carregar lugares:', err);
        });

    document.querySelectorAll('.route-btn').forEach(button => {
        button.addEventListener('click', function () {
            const lat = Number(button.dataset.lat);
            const lng = Number(button.dataset.lng);
            const name = button.dataset.name;
            buildRoute(lat, lng, name);
        });
    });
</script>

</body>
</html>
