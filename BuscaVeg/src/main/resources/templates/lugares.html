<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuscaVeg - Lugares</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7f5;
            margin: 0;
        }

        header {
            background: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #2e7d32;
        }

        nav {
            display: flex;
            gap: 20px;
        }

        nav a {
            color: #555;
            text-decoration: none;
            font-weight: bold;
        }

        main {
            width: 85%;
            max-width: 1200px;
            margin: 30px auto 50px;
        }

        .hero {
            margin-bottom: 25px;
        }

        #map {
            height: 500px;
            width: 100%;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
        }

        .places-container {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .place-card {
            background: white;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .route-btn {
            background: #43a047;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 12px;
            display: inline-block;
            text-decoration: none;
        }

        .empty-state {
            color: #555;
            font-weight: bold;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">🥗 BuscaVeg</div>
    <nav>
        <a th:href="@{/empresarialCTR/listarEmpresas}">Lugares</a>
        <a th:href="@{/favoritos}">Favoritos</a>
        <a th:href="@{/perfil}">Perfil</a>
    </nav>
</header>

<main>
    <section class="hero">
        <h1>Encontre seu próximo lugar favorito</h1>
        <p>Veja os estabelecimentos mais próximos de você e calcule a rota até eles.</p>
    </section>

    <div id="map"></div>

    <section class="places">
        <div class="section-title">
            <h2>Lugares disponíveis</h2>
        </div>

        <div class="places-container" th:if="${empresas != null}">
            <div th:if="${#lists.isEmpty(empresas)}" class="empty-state">
                Nenhum lugar encontrado.
            </div>

            <div class="place-card" th:each="empresa : ${empresa}">
                <div class="place-image">🥗</div>

                <div class="place-info">
                    <span class="tag" th:text="${empresa.tipoEspecializacao}">VEGANO</span>

                    <h3 th:text="${empresa.nomeFantasia}">Nome do estabelecimento</h3>

                    <p th:text="${empresa.endereco}">Endereço</p>
                    <p th:text="${empresa.telefone}">Telefone</p>

                    <button class="route-btn"
                            type="button"
                            th:attr="data-lat=${empresa.latitude}, data-lng=${empresa.longitude}, data-name=${empresa.nomeFantasia}">
                        Traçar rota
                    </button>
                </div>
            </div>
        </div>
    </section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script th:inline="javascript">
    const maptilerKey = "YOUR_MAPTILER_KEY";
    const orsKey = "YOUR_ORS_KEY";

    const userLat = /*[[${usuario != null && usuario.latitude != null ? usuario.latitude : -23.5505}]]*/ -23.5505;
    const userLng = /*[[${usuario != null && usuario.longitude != null ? usuario.longitude : -46.6333}]]*/ -46.6333;

    const map = L.map('map').setView([userLat, userLng], 13);

    L.tileLayer( https://api.maptiler.com/maps/streets/{z}/{x}/{y}.png?key=${maptilerKey}, {
        attribution: '&copy; <a href="https://www.maptiler.com/copyright/">MapTiler</a> &copy; OpenStreetMap contributors'
    }).addTo(map);

    const userMarker = L.marker([userLat, userLng]).addTo(map);
    userMarker.bindPopup("Você está aqui");

    const routeLayer = L.layerGroup().addTo(map);

    function clearRoute() {
        routeLayer.clearLayers();
    }

    function addPlaceMarker(lat, lng, nome, id) {
        const marker = L.marker([lat, lng]).addTo(map);

        marker.bindPopup(
            <div>
                <strong>${nome}</strong><br>
                <button class="route-btn" data-place-id="${id}" data-lat="${lat}" data-lng="${lng}" data-name="${nome}">
                    Traçar rota
                </button>
            </div>
        );

        marker.on('popupopen', function () {
            const buttons = document.querySelectorAll('[data-place-id]');
            buttons.forEach(btn => {
                btn.addEventListener('click', function () {
                    const lat = Number(btn.dataset.lat);
                    const lng = Number(btn.dataset.lng);
                    const name = btn.dataset.name;

                    buildRoute(lat, lng, name);
                });
            });
        });

        return marker;
    }

    async function buildRoute(destLat, destLng, destName) {
        clearRoute();

        let startLat = userLat;
        let startLng = userLng;

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function (position) {
                startLat = position.coords.latitude;
                startLng = position.coords.longitude;

                const userMarker2 = L.marker([startLat, startLng]).addTo(map);
                userMarker2.bindPopup("Sua localização atual");
                clearRoute();

                fetch("https://api.openrouteservice.org/v2/directions/driving-car", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${orsKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        coordinates: [[startLng, startLat], [destLng, destLat]],
                        format: "json",
                        geometry: true
                    })
                })
                .then(res => res.json())
                .then(data => {
                    if (!data.routes || !data.routes.length) {
                        alert("Não foi possível calcular a rota.");
                        return;
                    }

                    const coords = data.routes[0].geometry.coordinates;
                    const routePoints = coords.map(([lng, lat]) => [lat, lng]);

                    L.polyline(routePoints, { color: "#2e7d32", weight: 5 }).addTo(routeLayer);
                    map.fitBounds(L.polyline(routePoints).getBounds(), { padding: [30, 30] });

                    const popup = L.popup()
                        .setLatLng([destLat, destLng])
                        .setContent(`<strong>${destName}</strong><br>Destino: ${destName}`);

                    popup.openOnMap(map);
                })
                .catch(() => {
                    alert("Erro ao calcular rota com ORS.");
                });
            }, function () {
                fetch("https://api.openrouteservice.org/v2/directions/driving-car", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${orsKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        coordinates: [[userLng, userLat], [destLng, destLat]],
                        format: "json",
                        geometry: true
                    })
                })
                .then(res => res.json())
                .then(data => {
                    if (!data.routes || !data.routes.length) {
                        alert("Não foi possível calcular a rota.");
                        return;
                    }

                    const coords = data.routes[0].geometry.coordinates;
                    const routePoints = coords.map(([lng, lat]) => [lat, lng]);

                    L.polyline(routePoints, { color: "#2e7d32", weight: 5 }).addTo(routeLayer);
                    map.fitBounds(L.polyline(routePoints).getBounds(), { padding: [30, 30] });
                })
                .catch(() => {
                    alert("Erro ao calcular rota com ORS.");
                });
            });
        } else {
            fetch("https://api.openrouteservice.org/v2/directions/driving-car", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${orsKey}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    coordinates: [[userLng, userLat], [destLng, destLat]],
                    format: "json",
                    geometry: true
                })
            })
            .then(res => res.json())
            .then(data => {
                if (!data.routes || !data.routes.length) {
                    alert("Não foi possível calcular a rota.");
                    return;
                }

                const coords = data.routes[0].geometry.coordinates;
                const routePoints = coords.map(([lng, lat]) => [lat, lng]);

                L.polyline(routePoints, { color: "#2e7d32", weight: 5 }).addTo(routeLayer);
                map.fitBounds(L.polyline(routePoints).getBounds(), { padding: [30, 30] });
            })
            .catch(() => {
                alert("Erro ao calcular rota com ORS.");
            });
        }
    }

    fetch("/api/lugares/proximos?lat=" + userLat + "&lng=" + userLng + "&raioKm=10")
        .then(res => res.json())
        .then(data => {
            if (!data || !data.length) {
                return;
            }

            data.forEach(place => {
                addPlaceMarker(place.latitude, place.longitude, place.nome, place.id);
            });
        })
        .catch(() => {
            console.error("Erro ao carregar lugares.");
        });
</script>

</body>
</html>
