<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuscaVeg - Cadastro</title>
    <link rel="stylesheet" th:href="@{/estilo.css}">
</head>
<body class="pagina-cadastro">
    
<div class="cadastro-container">
    <div class="logo">
        <p>𖧧 BuscaVeg</p>
    </div>


    <h1>Crie sua conta</h1>
    <p class="subtitle">Faça seu cadastro para começar a usar o BuscaVeg.</p>

    <form th:action="@{/usuarioCTR/salvarUsuario}" th:object="${usuario}" method="post">
        <div th:if="${erro}" class="alert" th:text="${erro}"></div>

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <label for="nome">Nome completo</label>
        <input id="nome" type="text" th:field="*{nome}" placeholder="Digite seu nome" required>

        <label for="email">E-mail</label>
        <input id="email" type="email" th:field="*{email}" placeholder="Digite seu e-mail" required>

        <label for="password">Senha</label>
        <input id="password" type="password" th:field="*{password}" placeholder="Digite sua senha" required>

        <label for="perfilAlimentar">Tipo de alimentação</label>
        <select id="perfilAlimentar" th:field="*{perfilAlimentar}" required>
            <option value="">Selecione</option>
            <option value="VEGETARIANO">Vegetariano</option>
            <option value="VEGANO">Vegano</option>
        </select>

        <label for="dataNascimento">Data de nascimento</label>
        <input id="dataNascimento" type="date" th:field="*{dataNascimento}">

        <label for="endereco">Endereço completo</label>
        <input id="endereco" type="text" th:field="*{endereco}" placeholder="Rua, número, bairro, cidade" required>

        <input type="hidden" id="latitude" th:field="*{latitude}">
        <input type="hidden" id="longitude" th:field="*{longitude}">

        <button type="submit">Criar conta</button>
    </form>

    <p class="login-link">
        Já possui uma conta?
        <a th:href="@{/usuarioCTR/login}">Entrar</a>
    </p>
</div>

</body>
</html>
