<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>BuscaVeg - Cadastro</title>

<link rel="stylesheet" href="/css/cadastro.css">
```

</head>

<body>

```
<div class="cadastro-container">

    <div class="logo">
        🥗
    </div>

    <h1>Crie sua conta</h1>

    <p class="subtitle">
        Faça seu cadastro para começar a usar o BuscaVeg.
    </p>

    <form th:action="@/{}">

        <label>Username</label>
        <input
            type="text"
            name="username"
            placeholder="Digite seu username"
            required>

        <label>Nome completo</label>
        <input
            type="text"
            name="nome"
            placeholder="Digite seu nome"
            required>

        <label>E-mail</label>
        <input
            type="email"
            name="email"
            placeholder="Digite seu e-mail"
            required>

        <label>Senha</label>
        <input
            type="password"
            name="senha"
            placeholder="Digite sua senha"
            required>

        <label>Confirmar senha</label>
        <input
            type="password"
            name="confirmarSenha"
            placeholder="Confirme sua senha"
            required>

        <label>Tipo de usuário</label>

        <select name="role" required>

            <option value="">
                Selecione seu tipo de usuário
            </option>

            <option value="usuario">
                Usuário
            </option>

            <option value="estabelecimento">
                Estabelecimento
            </option>

        </select>

        <button type="submit">
            Criar conta
        </button>

    </form>

    <p class="login-link">
        Já possui uma conta?
        <a href="login.html">Entrar</a>
    </p>

</div>
```

</body>

</html>
